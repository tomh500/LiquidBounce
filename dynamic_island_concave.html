<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G2 Continuous Dynamic Island</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0b0f17;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 桌面/浏览器模拟容器 */
    .screen {
      width: 800px;
      height: 200px;
      background: #ffffff;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    /* 模拟背景上的浏览器标签页形态 */
    .browser-bar {
      height: 38px;
      background: #f1f3f4;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      padding-left: 20px;
      font-size: 12px;
      color: #5f6368;
    }

    /* 精确拟合 G2 连续曲率（顶部凹角 + 底部超椭圆凸角） */
    .island-container {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 440px;
      height: 44px;
      background: #000000;
      
      /* SVG Clip-Path 精确控制 G2 超椭圆圆角 */
      clip-path: path("M 0 0 C 14 0, 18 4, 18 14 C 18 32, 32 44, 60 44 L 380 44 C 408 44, 422 32, 422 14 C 422 4, 426 0, 440 0 Z");
      
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      color: #ffffff;
      z-index: 10;
    }

    /* 左侧应用图标 */
    .app-icon {
      width: 20px;
      height: 20px;
      background: #00c853;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    /* 中间歌词文本 */
    .island-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.25;
    }

    .lyric-en {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }

    .lyric-en .dim {
      color: #666666;
    }

    .lyric-zh {
      font-size: 10px;
      color: #a1a1aa;
    }

    /* 右侧封面 */
    .album-art {
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="screen">
    <div class="browser-bar">| 听歌识... × &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; | 必应翻译 ×</div>
    
    <!-- 动态灵动岛 -->
    <div class="island-container">
      <div class="app-icon">♫</div>
      
      <div class="island-center">
        <div class="lyric-en">Having to leave the tracks <span class="dim">behind</span></div>
        <div class="lyric-zh">只能将车辆撤留在身后</div>
      </div>

      <div class="album-art"></div>
    </div>
  </div>

</body>
</html>
